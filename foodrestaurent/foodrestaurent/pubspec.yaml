name: food_user_application
description: "A new Flutter project."
publish_to: 'none'

version: 3.2.2+7

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.10.0
  flutter_secure_storage: ^10.3.1
  cached_network_image: ^3.4.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.4.3
  socket_io_client: ^3.1.6
  image_picker: ^1.2.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_maps_flutter: ^2.13.1
  intl: ^0.20.2
  flutter_local_notifications: ^18.0.1
  shared_preferences: ^2.5.5
  audioplayers: ^6.7.1
  connectivity_plus: ^6.1.1
  permission_handler: ^13.0.0
  android_intent_plus: ^6.1.0
  in_app_update: ^4.2.0
  in_app_review: ^2.0.12
  # Print bill: the bill is drawn as a PDF and sent to the system print dialog.
  # Held below printing 5.15 / pdf 3.13, which need Dart 3.12 (sdk here is ^3.11.4).
  pdf: ">=3.11.3 <3.13.0"
  printing: ">=5.14.3 <5.15.0"

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  permission_handler_android: 13.0.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/image/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_foreground: "assets/image/logo.png"
  adaptive_icon_background: "#E0007A"

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/image/
    - assets/sound/

  fonts:
    - family: ManropeVariable
      fonts:
        - asset: assets/font/Manrope-VariableFont_wght.ttf